<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | COMP 315</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <section class="form-card" aria-labelledby="page-title">
                    <p class="text-uppercase text-primary small fw-bold">COMP 315 · Student Portal</p>
                    <h1 id="page-title">Student Login</h1>
                    <p class="text-secondary">Sign in using your student credentials.</p>
                    <form action="login_process.php" method="post">
                        <div class="mb-3">
                            <label for="student_id" class="form-label">Student ID</label>
                            <input type="text" id="student_id" name="student_id" class="form-control" placeholder="ST12345" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                        </div>
                        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                            <button type="submit" class="btn btn-primary">Login</button>
                            <a href="#">Forgot Password</a>
                        </div>
                    </form>
                    <p class="mt-4 mb-0"><a href="index.html">New Student? Register Here!</a></p>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
