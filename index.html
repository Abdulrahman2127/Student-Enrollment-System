<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment | COMP 315</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <section class="form-card" aria-labelledby="page-title">
                    <p class="text-uppercase text-primary small fw-bold">COMP 315 · Student Portal</p>
                    <h1 id="page-title">Student Enrollment</h1>
                    <p class="text-secondary">Enter your details to register. Fields marked * are required.</p>
                    <form id="enrollment-form" action="enroll_process.php" method="post">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="full_name" class="form-label">Full Name *</label>
                                <input type="text" id="full_name" name="full_name" class="form-control" autocomplete="name" required aria-describedby="full_name-error">
                                <div id="full_name-error" class="invalid-feedback" aria-live="polite"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="student_id" class="form-label">Student ID *</label>
                                <input type="text" id="student_id" name="student_id" class="form-control" placeholder="ST12345" pattern="ST[0-9]{5}" maxlength="7" required aria-describedby="student_id-error">
                                <div id="student_id-error" class="invalid-feedback" aria-live="polite"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email Address *</label>
                                <input type="email" id="email" name="email" class="form-control" autocomplete="email" required aria-describedby="email-error">
                                <div id="email-error" class="invalid-feedback" aria-live="polite"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="password" class="form-label">Password *</label>
                                <input type="password" id="password" name="password" class="form-control" autocomplete="new-password" minlength="8" required aria-describedby="password-help password-error">
                                <div id="password-help" class="form-text">At least 8 characters, including uppercase, lowercase, and a number.</div>
                                <div id="password-error" class="invalid-feedback" aria-live="polite"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="confirm_password" class="form-label">Confirm Password *</label>
                                <input type="password" id="confirm_password" name="confirm_password" class="form-control" autocomplete="new-password" minlength="8" required aria-describedby="confirm_password-error">
                                <div id="confirm_password-error" class="invalid-feedback" aria-live="polite"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="date_of_birth" class="form-label">Date of Birth</label>
                                <input type="date" id="date_of_birth" name="date_of_birth" class="form-control" autocomplete="bday">
                            </div>
                            <div class="col-md-6">
                                <label for="program" class="form-label">Program of Study *</label>
                                <select id="program" name="program" class="form-select" required aria-describedby="program-error">
                                    <option value="">Select a program</option>
                                    <option>Computer Science</option>
                                    <option>Engineering</option>
                                    <option>Business Administration</option>
                                    <option>Arts &amp; Humanities</option>
                                </select>
                                <div id="program-error" class="invalid-feedback" aria-live="polite"></div>
                            </div>
                            <div class="col-md-6">
                                <fieldset>
                                    <legend>Gender</legend>
                                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="male" value="Male"><label class="form-check-label" for="male">Male</label></div>
                                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="female" value="Female"><label class="form-check-label" for="female">Female</label></div>
                                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="other" value="Other"><label class="form-check-label" for="other">Other</label></div>
                                </fieldset>
                            </div>
                            <div class="col-md-6">
                                <fieldset>
                                    <legend>Preferred Contact Method</legend>
                                    <div class="form-check"><input class="form-check-input" type="checkbox" name="contact_methods[]" id="contact_email" value="Email"><label class="form-check-label" for="contact_email">Email</label></div>
                                    <div class="form-check"><input class="form-check-input" type="checkbox" name="contact_methods[]" id="contact_sms" value="SMS"><label class="form-check-label" for="contact_sms">SMS</label></div>
                                    <div class="form-check"><input class="form-check-input" type="checkbox" name="contact_methods[]" id="contact_phone" value="Phone Call"><label class="form-check-label" for="contact_phone">Phone Call</label></div>
                                </fieldset>
                            </div>
                            <div class="col-12 d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary">Submit</button>
                                <button type="reset" class="btn btn-secondary">Reset</button>
                            </div>
                        </div>
                    </form>
                    <p class="mt-4 mb-0">Already registered? <a href="login.html">Login here</a></p>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
